server {
    listen 80;
    server_name example.com;  # reemplazar; HTTPS con certbot en DEP-002

    root /opt/membership/frontend/build/web;
    index index.html;

    location /api/ { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /health { proxy_pass http://127.0.0.1:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
